name: secop
version: "1.0.0"
profile: secop

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  secop:
    silver:
      +schema: silver
    gold:
      +schema: gold
      +materialized: table

seeds:
  secop:
    +schema: silver
    segmentos_unspsc:
      +column_types:
        codigo_segmento: string   # para que "00" no se vuelva 0