version: 2

models:
  - name: dim_entidad
    description: Entidades públicas contratantes, con sus atributos más recientes.
    columns:
      - name: codigo_entidad
        data_tests: [unique, not_null]

  - name: dim_proveedor
    description: Proveedores adjudicados. Las personas naturales no tienen nombre ni documento.
    columns:
      - name: id_proveedor
        data_tests: [unique, not_null]

  - name: dim_segmento
    description: Segmentos del clasificador UNSPSC, agrupados en bienes y servicios.
    columns:
      - name: codigo_segmento
        data_tests: [unique, not_null]

  - name: dim_fecha
    description: Calendario para analizar por fecha de firma.
    columns:
      - name: fecha
        data_tests: [unique, not_null]

  - name: fct_contratos
    description: >
      Un contrato por fila (grano), con actividad en SECOP II desde la fecha de arranque
      de la extracción. Los valores están en pesos colombianos.
    columns:
      - name: id_contrato
        data_tests: [unique, not_null]
      - name: codigo_entidad
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_entidad')
                field: codigo_entidad
      - name: id_proveedor
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_proveedor')
                field: id_proveedor
      - name: fecha_firma
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha
      - name: codigo_segmento
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_segmento')
                field: codigo_segmento