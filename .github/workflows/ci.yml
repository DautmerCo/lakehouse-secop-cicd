name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform · formato y validación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  extraccion:
    name: Extracción · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.6
      - run: ruff check extraccion

  dbt:
    name: dbt · build en esquemas de CI
    runs-on: ubuntu-latest
    concurrency:
      group: dbt-ci            # dos PR no pueden usar los esquemas secop_ci_* a la vez
      cancel-in-progress: false
    env:
      DBT_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBT_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t secop-dbt:ci dbt

      - name: dbt build
        run: >
          docker run --rm
          -e DBT_DATABRICKS_HOST -e DBT_DATABRICKS_HTTP_PATH -e DBT_DATABRICKS_TOKEN
          secop-dbt:ci build --target ci

      - name: Borrar esquemas de CI
        if: always()
        run: >
          docker run --rm
          -e DBT_DATABRICKS_HOST -e DBT_DATABRICKS_HTTP_PATH -e DBT_DATABRICKS_TOKEN
          secop-dbt:ci run-operation borrar_esquemas_ci --target ci