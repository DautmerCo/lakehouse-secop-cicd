name: Pipeline diario

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a. m. en Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: pipeline-dev
  cancel-in-progress: false

env:
  DATABRICKS_HOST: https://${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  extraer:
    name: 1 · Extraer de SECOP II
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extraccion/requirements.txt
      - run: pip install -r extraccion/requirements.txt
      - run: python extraccion/extraer_secop.py --entorno dev

  bronze:
    name: 2 · Bronze con Auto Loader
    needs: extraer
    runs-on: ubuntu-latest
    steps:
      - uses: databricks/setup-cli@v1.28.0
      - name: Ejecutar el job de Databricks
        run: |
          id_job=$(databricks jobs list --name "[dev] secop_pipeline" -o json | jq -r '.[0].job_id')
          resultado=$(databricks jobs run-now "$id_job" --timeout 30m -o json | jq -r '.state.result_state')
          echo "Resultado del job: $resultado"
          test "$resultado" = "SUCCESS"

  dbt:
    name: 3 · Silver y Gold con dbt
    needs: bronze
    runs-on: ubuntu-latest
    env:
      DBT_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBT_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: dbt build con la imagen publicada
        run: >
          docker run --rm
          -e DBT_DATABRICKS_HOST -e DBT_DATABRICKS_HTTP_PATH -e DBT_DATABRICKS_TOKEN
          ghcr.io/dautmerco/secop-dbt:latest build --target dev